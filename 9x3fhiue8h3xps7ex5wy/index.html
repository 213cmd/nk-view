<style>/* 日記の見た目。黒いデザイン（端末の設定にかかわらず、いつも黒） */
:root {
  color-scheme: dark;
  --accent: #0a84ff; --ink: #f2f2f7; --sub: #b4b4bb; --muted: #8e8e93; --hair: #38383a; --bg: #000; --surface: #1c1c1e; --fill: rgba(118,118,128,.28);
  --warn-bg: #3a2c0a; --warn-ink: #ffd88a; --red: #ff5a5f;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 120px; }

.top { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
h1 { font-size: 34px; line-height: 41px; margin: 4px 0; }
.iconbtn { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface); color: var(--accent); }
.search { display: flex; gap: 8px; margin: 8px 0 4px; }
.search input { flex: 1; min-width: 0; border: 0; background: var(--fill); border-radius: 10px; padding: 0 12px; height: 40px; }
.month { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; }
.month select { border: 0; background: var(--surface); border-radius: 999px; height: 44px; padding: 0 16px; font-weight: 600; }
.month button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface); color: var(--accent); font-size: 24px; padding: 0; }
.month button:disabled { opacity: .3; }
.period { color: var(--muted); font-size: 14px; margin: 12px 4px 0; }

.day { margin-top: 26px; }
.day h2 { font-size: 20px; line-height: 25px; margin: 0 4px 8px; }
.entry { background: var(--surface); border-radius: 16px; padding: 12px 16px 14px; margin-bottom: 10px; }
.entry header { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
.entry time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.body, .tr p { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 8px; }
.link { border: 0; background: none; color: var(--accent); padding: 6px 0; font-size: 15px; }
.audio { margin: 8px 0; } .audio audio, .recbox audio { width: 100%; height: 44px; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; border: 0; border-radius: 999px; background: var(--fill); color: var(--accent); padding: 0 18px 0 12px; font-weight: 600; }
.tr { border-top: 1px solid var(--hair); margin-top: 10px; padding-top: 8px; }
.trh { font-size: 13px; color: var(--muted); font-weight: 600; }
.tr.sum { border-top: 0; margin-top: 4px; padding: 10px 12px; background: var(--fill); border-radius: 12px; } .tr.sum p { margin-bottom: 0; }
/* 写真 */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 8px 0; }
.photos.one { grid-template-columns: 1fr; }
.ph { position: relative; display: block; aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--fill); color: var(--muted); font-size: 12px; }
.photos.one .ph { aspect-ratio: 4 / 3; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.viewer { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.94); display: grid; place-items: center; cursor: zoom-out; }
.viewer img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
.phedit { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.phedit .ph button { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; padding: 0; }
.addph { aspect-ratio: 1; display: grid; place-items: center; text-align: center; border: 1px dashed var(--muted); border-radius: 10px; color: var(--accent) !important; font-size: 13px !important; margin: 0 !important; cursor: pointer; padding: 4px; }
.tr.wait, .tr.err { color: var(--sub); font-size: 15px; } .tr.err { color: var(--red); }
.seg { cursor: pointer; border-radius: 4px; } .seg:hover { background: var(--fill); }
.seg.low { text-decoration: underline dotted var(--red); text-underline-offset: 4px; }
.note, .muted { color: var(--muted); font-size: 13px; line-height: 18px; }
.empty { color: var(--muted); text-align: center; margin: 48px 0; }
.alert { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 10px 14px; margin-top: 12px; font-size: 15px; }

.fab { position: fixed; right: max(20px, calc(50vw - 340px)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 60px; height: 60px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); z-index: 5; }
.fab svg { width: 28px; height: 28px; }
.btn { border: 0; background: var(--fill); border-radius: 999px; min-height: 44px; padding: 0 18px; font-weight: 600; color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; } .btn.danger { color: var(--red); }

/* 書く・直す画面（スマホは下から、PCは中央） */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: var(--bg); width: 100%; max-width: 600px; max-height: 94vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 4px 16px calc(24px + env(safe-area-inset-bottom)); }
.sbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 52px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sbar button { border: 0; background: none; color: var(--accent); min-height: 44px; padding: 0; justify-self: start; }
.sbar .go { justify-self: end; font-weight: 700; } .sbar button:disabled { opacity: .5; }
.sheet label { display: block; font-size: 13px; color: var(--sub); margin: 14px 4px 6px; }
.sheet input[type=date], .sheet input[type=time], .sheet textarea { width: 100%; border: 0; background: var(--surface); border-radius: 12px; padding: 10px 12px; min-height: 44px; }
.sheet textarea { resize: vertical; line-height: 1.6; } .sheet textarea:disabled { color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.recbox { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.recbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; padding: 0 20px 0 14px; font-weight: 600; }
.recbtn.on { background: var(--red); }
.rectime { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 20px; }
.recrow { display: flex; justify-content: space-between; align-items: center; width: 100%; }
.danger { margin-top: 24px; text-align: center; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; margin-top: 8px; }
th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--hair); font-weight: 400; font-size: 15px; } th { color: var(--sub); white-space: nowrap; } tr:last-child > * { border-bottom: 0; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(40,40,42,.94); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 15px; z-index: 30; max-width: 92vw; text-align: center; }

.lock { max-width: 340px; margin: 16vh auto 0; text-align: center; }
.lock h2 { font-size: 20px; }
.lock input[type=password] { width: 100%; border: 0; background: var(--surface); border-radius: 12px; padding: 12px; margin: 14px 0 8px; }
.lock .check { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 15px; } .lock .check input { width: 20px; height: 20px; }
.lock .err { color: var(--red); min-height: 24px; font-size: 14px; }

/* ---- iPhone（Safari）向けの直し。iPhone SE（幅320〜375）でも横にはみ出さないように ---- */
html, body { max-width: 100%; overflow-x: hidden; }
.wrap { padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-top: env(safe-area-inset-top); }
.entry, .tr, .body, .day h2, .note { min-width: 0; overflow-wrap: anywhere; }
/* Safari の日付・時刻の入力欄は、幅の指定を無視して広がることがあるので、見た目の飾りを外して幅を固定する */
.sheet input[type=date], .sheet input[type=time] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; line-height: 24px; }
.sheet input::-webkit-date-and-time-value { text-align: left; margin: 0; }
.row2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.row2 > div, .search, .month select { min-width: 0; }
.month select { max-width: calc(100% - 100px); }
.sheet > div > * { max-width: 100%; }
/* Safari では画面の高さ（vh）にアドレスバーの分も入るので、見えている高さ（dvh）を使う。上の「キャンセル／保存」が隠れないように */
.sheet { height: 100vh; height: 100dvh; }
.sheet > div { max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); }
.viewer { height: 100dvh; }
/* 幅の狭い iPhone（SE など） */
@media (max-width: 380px) {
  body { font-size: 16px; }
  h1 { font-size: 28px; line-height: 34px; }
  .wrap { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
  .entry { padding: 10px 12px 12px; }
  .sheet > div { padding-left: 12px; padding-right: 12px; }
  .row2 { gap: 8px; }
  .sheet input[type=date], .sheet input[type=time] { padding: 10px 8px; font-size: 16px; }
  .phedit { grid-template-columns: repeat(3, 1fr); }
  .fab { width: 56px; height: 56px; right: 16px; }
}

@media (min-width: 700px) { .sheet { align-items: center; } .sheet > div { border-radius: 20px; } .toast { bottom: 32px; } }
</style>

<script>// 日記の画面。文章と音声を、非公開の保管庫（GitHub）に保存する。音声の文字起こしは保管庫の側（GitHub Actions）で行う
(function () {
  const $ = (s, el) => (el || document).querySelector(s);
  const app = $("#app");
  const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const WD = ["日", "月", "火", "水", "木", "金", "土"];
  const nowParts = () => { const d = new Date(); return { date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, time: `${pad(d.getHours())}:${pad(d.getMinutes())}`, sec: pad(d.getSeconds()) }; };
  const dayLabel = (date) => { const d = new Date(date + "T00:00:00"); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
  const mlabel = (m) => `${m.slice(0, 4)}年${+m.slice(5)}月`;
  const dur = (s) => `${Math.floor(s / 60)}:${pad(Math.round(s) % 60)}`;
  const payload = JSON.parse($("#payload").textContent), PWKEY = "nikki-pw", DRAFT = "nikki-draft";
  const LOWCONF = 0.8;   // これより自信が低い部分には印を付ける

  let B;   // 保存先 { type: "github"|"local", repo, branch, token }
  const S = { month: nowParts().date.slice(0, 7), months: [], data: {}, q: "", results: null, raw: {} };

  // ---------- 保存先 ----------
  const b64e = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  const b64d = (s) => Uint8Array.from(atob(s.replace(/\s/g, "")), (c) => c.charCodeAt(0));
  const gh = (p, opt) => fetch(`https://api.github.com/repos/${B.repo}/${p}`, { cache: "no-store", ...(opt || {}),
    headers: { Authorization: `Bearer ${B.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
  const fail = (r) => { const e = new Error(r.status === 401 ? "保存先の鍵が無効です（期限切れかもしれません）" : r.status === 409 || r.status === 422 ? "ほかの端末の変更と重なりました" : `保存先エラー ${r.status}`); e.status = r.status; return e; };
  const store = {
    async get(path) {
      if (B.type === "local") { const r = await fetch(`/api/file?path=${encodeURIComponent(path)}`, { cache: "no-store" }); if (r.status === 404) return null; if (!r.ok) throw fail(r); return { bytes: new Uint8Array(await r.arrayBuffer()), sha: null }; }
      const r = await gh(`contents/${path}?ref=${B.branch}`); if (r.status === 404) return null; if (!r.ok) throw fail(r);
      const j = await r.json(); let c = j.encoding === "base64" ? j.content : "";
      if (!c) { const r2 = await gh(`git/blobs/${j.sha}`); if (!r2.ok) throw fail(r2); c = (await r2.json()).content; }   // 1MBをこえるファイル（音声）
      return { bytes: b64d(c), sha: j.sha };
    },
    async put(path, bytes, sha, message) {
      if (B.type === "local") { const r = await fetch(`/api/file?path=${encodeURIComponent(path)}`, { method: "PUT", body: bytes }); if (!r.ok) throw fail(r); return; }
      const r = await gh(`contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64e(bytes), branch: B.branch, ...(sha ? { sha } : {}) }) });
      if (!r.ok) throw fail(r);
    },
    async del(path, message) {
      if (B.type === "local") { await fetch(`/api/file?path=${encodeURIComponent(path)}`, { method: "DELETE" }); return; }
      const cur = await gh(`contents/${path}?ref=${B.branch}`); if (!cur.ok) return;
      await gh(`contents/${path}`, { method: "DELETE", body: JSON.stringify({ message, sha: (await cur.json()).sha, branch: B.branch }) });
    },
    async list(dir) {
      if (B.type === "local") { const r = await fetch(`/api/list?dir=${encodeURIComponent(dir)}`, { cache: "no-store" }); return r.ok ? r.json() : []; }
      const r = await gh(`contents/${dir}?ref=${B.branch}`); if (r.status === 404) return []; if (!r.ok) throw fail(r);
      return (await r.json()).map((x) => x.name);
    },
  };
  const dec = (b) => JSON.parse(new TextDecoder().decode(b)), enc = (o) => new TextEncoder().encode(JSON.stringify(o, null, 1) + "\n");
  const mfile = (m) => `entries/${m}.json`;
  async function loadMonth(m, force) {
    if (S.data[m] && !force) return S.data[m];
    const f = await store.get(mfile(m));
    return (S.data[m] = f ? dec(f.bytes) : []);
  }
  // 最新を読み直してから変更して保存する（ほかの端末や文字起こしの結果を消さないため）。重なったらやり直す
  async function saveMonth(m, fn, message) {
    for (let i = 0; ; i++) {
      const f = await store.get(mfile(m)), next = fn(f ? dec(f.bytes) : []);
      next.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      try { await store.put(mfile(m), enc(next), f && f.sha, message); S.data[m] = next; if (!S.months.includes(m)) S.months = [...S.months, m].sort(); return; }
      catch (e) { if (i >= 3 || (e.status !== 409 && e.status !== 422)) throw e; }
    }
  }

  // ---------- 送信前の音声を端末に取っておく（送信に失敗しても消えないように） ----------
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open("nikki", 1); r.onupgradeneeded = () => r.result.createObjectStore("outbox", { keyPath: "id" }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const box = async (mode, fn) => { try { const db = await idb(); return await new Promise((res, rej) => { const t = db.transaction("outbox", mode), q = fn(t.objectStore("outbox")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); } catch (e) { return mode === "readonly" ? [] : null; } };
  const outbox = { put: (x) => box("readwrite", (s) => s.put(x)), del: (id) => box("readwrite", (s) => s.delete(id)), all: () => box("readonly", (s) => s.getAll()) };

  let toastT;
  const toast = (msg) => { let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4000); };

  // ---------- 表示 ----------
  const ic = (d) => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = { mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>', plus: '<path d="M12 5v14M5 12h14"/>', gear: '<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.3l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2.3-1.3L14 3h-4l-.3 2.4a7 7 0 0 0-2.3 1.3l-2.3-.9-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .9.1 1.3l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2.3 1.3L10 21h4l.3-2.4a7 7 0 0 0 2.3-1.3l2.3.9 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>' };

  function trHtml(e) {
    const t = e.tr; if (!e.audio) return "";
    if (!t || t.status === "pending") return `<div class="tr wait">文字に直しています…（1〜3分ほどかかります）</div>`;
    if (t.status === "error") return `<div class="tr err">文字にできませんでした：${esc(t.err || "")} <button class="link" data-act="retry" data-v="${esc(e.id)}">もう一度ためす</button></div>`;
    const sum = t.summary ? `<div class="tr sum"><div class="trh">要約（文字起こしをもとに作成）</div><p>${esc(t.summary)}</p></div>` : "";
    if (t.edited != null) return `${sum}<div class="tr"><div class="trh">文字起こし（自分で直したもの）</div><p>${esc(t.edited)}</p></div>`;
    const segs = t.segs || [], low = segs.some((s) => s.conf != null && s.conf < LOWCONF), raw = S.raw[e.id];
    if (!segs.length) return `<div class="tr"><div class="trh">文字起こし</div><p class="muted">声が聞き取れませんでした。</p></div>`;
    return `${sum}<div class="tr"><div class="trh">文字起こし${raw ? "（整える前）" : ""}</div><p>${segs.map((s) =>
      `<span class="seg${s.conf != null && s.conf < LOWCONF ? " low" : ""}" data-act="seek" data-v="${esc(e.id)}" data-t="${s.t}" title="ここから再生">${esc(raw ? s.raw : s.text)}</span>`).join(raw ? " " : "")}</p>
      ${low ? '<div class="note">点線の部分は、聞き取りに自信がないところです。押すとその場所から再生できるので、聞いて確かめてください。</div>' : ""}
      <button class="link" data-act="raw" data-v="${esc(e.id)}">${raw ? "整えたものに戻す" : "整える前（聞き取ったまま）を見る"}</button></div>`;
  }
  const photosHtml = (e) => (e.photos && e.photos.length ? `<div class="photos${e.photos.length === 1 ? " one" : ""}">${e.photos.map((p, i) =>
    `<button class="ph" data-act="photo" data-v="${esc(e.id)}" data-i="${i}" data-photo="${esc(p.path)}" aria-label="写真を大きく見る"></button>`).join("")}</div>` : "");
  const entryHtml = (e) => `<article class="entry" id="e-${esc(e.id)}"><header><time>${esc(e.at.slice(11, 16))}</time><button class="link" data-act="edit" data-v="${esc(e.id)}">編集</button></header>
    ${e.text ? `<p class="body">${esc(e.text)}</p>` : ""}${photosHtml(e)}
    ${e.audio ? `<div class="audio" data-audio="${esc(e.id)}"><button class="playbtn" data-act="play" data-v="${esc(e.id)}">${ic(IC.play)}<span>音声を聞く${e.audio.sec ? `（${dur(e.audio.sec)}）` : ""}</span></button></div>${trHtml(e)}` : ""}</article>`;
  function listHtml(list) {
    if (!list.length) return `<p class="empty">まだ日記がありません。右下の「＋」から書けます。</p>`;

      <p class="note">文章と音声は非公開の保管庫に保存されます。音声は、文字に直すために Google の音声認識へ送られます。聞き取った文章は Claude へ送られ、句読点と改行を足し、「えー」「あのー」などのつなぎ言葉を消し、要約を作ります。つなぎ言葉のほかの言葉が1文字でも変わっていた場合は使わず、聞き取ったままを表示します。要約は音声そのものではなく、文字起こしから作っています。写真は長い辺1600pxに小さくして保存します。</p>

  // ---------- 起動（パスワードで保存先の情報を開く） ----------
  async function decrypt(p, pw) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(p.salt), iterations: p.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

  }
  async function start(cfg) {

    render();

    await open(S.month); poll();
  }
  function lock(msg) {

      <label class="check"><input type="checkbox" id="keep" checked> この端末に記憶する</label><div class="err">${esc(msg || "")}</div><button class="btn primary">開く</button></form></div>`;
    $("#lockF").onsubmit = async (e) => {
      e.preventDefault(); const pw = $("#pw").value;
      try { const d = await decrypt(payload, pw); if ($("#keep").checked) try { localStorage.setItem(PWKEY, pw); } catch (x) {} start(d); }
      catch (x) { lock("パスワードが違います"); }
    };
  }
  (async () => {
    // ほかのサイトの中に埋め込まれて表示されたときは、何も出さない
    if (window.top !== window.self) { document.body.textContent = ""; return; }
    if (!payload.enc) return start(payload.data);
    let saved = null; try { saved = localStorage.getItem(PWKEY); } catch (e) {}
    if (saved) try { return start(await decrypt(payload, saved)); } catch (e) {}
    lock();
  })();
})();
</script>
</body>
